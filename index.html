<head>

<meta name="application-name" content="PDT 360">
<meta name="description" content="Physical Duty Training 360: fuerza, HIT/HIIT y carrera planificados alrededor del servicio.">
<title>PDT 360</title>

<style>

/* Layout: cuaderno de instrucción — barra de semana, 7 fichas de día con franja de color (rojo = carrera dura, amarillo = hueco SC), panel de detalle debajo */
:root{
  --bg:#eceee7; --surface:#f8f9f4; --ink:#1c231b; --muted:#5b6457; --line:#cdd3c5;
  --olive:#4b5c2e; --on-olive:#f4f6ee; --cia:#c3362c; --sc:#e6bf1e; --on-sc:#2b2300;
  --ok:#2e7643; --warn:#a85f17; --soft:#e2e6da;
  --c-gym:#4f6a1f; --c-cf:#2f6fa8; --c-sc:#b8860b; --c-run:#c0306a;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141913; --surface:#1c2219; --ink:#e3e8db; --muted:#9aa492; --line:#323c2e;
  --olive:#9fb86c; --on-olive:#18200f; --cia:#e2574b; --sc:#d8b42a; --on-sc:#211b00;
  --ok:#6cc086; --warn:#e2a056; --soft:#252d21; --c-gym:#6f9a2e; --c-cf:#5296e0; --c-sc:#b8891a; --c-run:#e0608f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141913; --surface:#1c2219; --ink:#e3e8db; --muted:#9aa492; --line:#323c2e;
  --olive:#9fb86c; --on-olive:#18200f; --cia:#e2574b; --sc:#d8b42a; --on-sc:#211b00;
  --ok:#6cc086; --warn:#e2a056; --soft:#252d21; --c-gym:#6f9a2e; --c-cf:#5296e0; --c-sc:#b8891a; --c-run:#e0608f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
h1 small{display:block;font-family:var(--body);font-size:.8rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:4px}
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0;text-transform:uppercase;letter-spacing:.04em}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .lbl{font-family:var(--display);font-weight:600;font-size:1.15rem;min-width:190px;text-align:center;text-transform:uppercase;letter-spacing:.03em}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px}
button:hover{border-color:var(--olive)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--olive);outline-offset:1px}
button.primary{background:var(--olive);color:var(--on-olive);border-color:var(--olive);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--cia);border-color:var(--cia);background:transparent}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--olive)}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;width:100%;min-width:0}
label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .check{display:flex;align-items:center;gap:6px;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.toolbar .check input{width:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.hard{border-top-color:var(--cia)}
.day.easy{border-top-color:color-mix(in srgb,var(--cia) 45%,var(--line))}
.day.free{border-top-color:var(--sc)}
.day.off{opacity:.55}
.day .dh{display:flex;justify-content:space-between;align-items:baseline}
.day .dn{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:.04em}
.day .dd{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.slotlbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:2px}
.chip{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:4px;font-weight:600;font-size:.9rem;line-height:1.2;border:1px solid transparent}
.chip.sc{background:var(--sc);color:var(--on-sc)}
.chip.gym{background:var(--olive);color:var(--on-olive)}
.chip.runo{background:color-mix(in srgb,var(--cia) 14%,transparent);color:var(--ink);border:1px solid var(--cia)}
.chip.cmp{background:transparent;border:1px solid var(--olive);color:var(--olive)}
.chip.run{background:transparent;border:1px dashed var(--cia);color:var(--ink);font-weight:500;font-size:.8rem;cursor:default}
.chip.empty{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500;cursor:default}
.chip[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.notes{display:flex;flex-direction:column;gap:6px}
.note{font-size:.88rem;padding:7px 10px;border-left:3px solid var(--warn);background:var(--soft);border-radius:0 4px 4px 0}
.note.info{border-left-color:var(--olive)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel .ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.meta{font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--soft);color:var(--muted)}
.tag.up{color:var(--ok)} .tag.down{color:var(--cia)}
.blocks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.liftlog{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.liftlog .eh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.liftlog .eh b{font-weight:600}
.liftlog .eh select{width:auto}
.setrow{display:grid;grid-template-columns:24px repeat(3,minmax(0,90px));gap:6px;align-items:center;font-size:.85rem}
.setrow span{font-family:var(--mono);color:var(--muted)}
.setrow input{padding:4px 6px;font-family:var(--mono)}
.hist{display:flex;flex-direction:column}
.hist .hr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lift{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lift .big{font-family:var(--mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.lift svg{width:100%;height:56px;color:var(--olive)}
.lift.runc svg{color:var(--cia)}
.review{white-space:pre-wrap;font-size:.92rem;background:var(--soft);padding:12px;border-radius:4px}
.banner{font-size:.88rem;padding:9px 12px;border:1px solid var(--warn);border-radius:4px;background:var(--soft)}
details summary{cursor:pointer;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.absrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:.9rem;z-index:20}
.empty-state{color:var(--muted);font-size:.92rem;padding:8px 0}
/* Calendario */
.calhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.calhead .mlbl{font-family:var(--display);font-weight:700;font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;min-width:170px;text-align:center}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:300px}
.cal .dow{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:2px 4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px;min-height:92px;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.cell:hover{border-color:var(--olive)}
.cell.out{opacity:.45}
.cell.today{border-color:var(--ink);border-width:2px;padding:4px}
.cell.off{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--soft) 6px 8px)}
.cell .dnum{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.ci{display:flex;align-items:center;gap:5px;font-size:.76rem;line-height:1.15;min-width:0}
.ci i{flex:0 0 4px;align-self:stretch;min-height:12px;border-radius:2px;background:var(--c)}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ci.imp span{font-style:italic;color:var(--muted)}
.ci.cmp i{background:transparent;border:1.5px solid var(--c)}
.ci.cmp span{color:var(--muted)}
@media (max-width:640px){.cell{min-height:64px;padding:3px}.ci span{display:none}.ci{gap:0}.ci i{flex:1 1 auto;min-height:8px;height:8px}.cal{gap:3px}}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox .ax{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chartbox .tot{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox .hit{fill:transparent;cursor:default}
.chartbox .hit:hover{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;padding:6px 9px;border-radius:4px;white-space:nowrap;z-index:5;line-height:1.4}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px;background:var(--c)}
[hidden]{display:none!important}
/* Entrenar */
.trchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.trchip{white-space:nowrap;border-radius:20px;font-size:.85rem;padding:7px 12px}
.trchip.on{background:var(--olive);color:var(--on-olive);border-color:var(--olive);font-weight:600}
.trhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.trclock{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1}
.trbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.trbar i{display:block;height:100%;background:var(--olive);border-radius:4px}
.trrest{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--olive);color:var(--on-olive);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.trrest b{font-family:var(--mono);font-size:1.7rem;font-variant-numeric:tabular-nums;flex:1}
.trrest button{background:transparent;color:var(--on-olive);border-color:var(--on-olive);min-height:40px}
.trex{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.trex.full{border-color:var(--olive)}
.trex .eh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.trex .eh b{font-size:1.02rem}
.trgrid{display:grid;grid-template-columns:26px repeat(3,minmax(0,1fr)) 46px;gap:6px;align-items:center}
.trgrid .h{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.trgrid span.n{font-family:var(--mono);color:var(--muted);text-align:center}
.trgrid input{font-family:var(--mono);font-size:1rem;text-align:center;height:42px;padding:4px}
.trgrid .ok{width:44px;height:42px;padding:0;display:flex;align-items:center;justify-content:center}
.trgrid .ok[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.trgrid .done input{background:color-mix(in srgb,var(--olive) 10%,var(--bg))}
.trfoot{display:flex;gap:10px;flex-wrap:wrap}
.trfoot button{min-height:48px;flex:1}
@media (prefers-reduced-motion:no-preference){.chip,button{transition:border-color .15s,background .15s}}


/* ===== App móvil (prototipo aprobado) ===== */
html{-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh}
body.locked{overflow:hidden}
.top{position:sticky;top:0;z-index:15;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top h1{font-size:1.6rem;min-width:0;grid-column:1;grid-row:1}
.top .iconbtn{grid-column:2;grid-row:1}
.top .weeknav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:44px minmax(0,1fr) 44px auto;gap:6px;align-items:center}
.top .weeknav .lbl{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .weeknav .lbl{min-width:0;font-size:1rem}
.top .weeknav button{min-width:40px;min-height:40px;padding:4px 8px}
.iconbtn{min-width:44px;min-height:44px;padding:0;display:flex;align-items:center;justify-content:center}
.wrap{max-width:760px;padding-block:14px 24px}
.stack{display:flex;flex-direction:column;gap:12px}
button{min-height:44px}
.tag,.trchip,.trgrid .ok{min-height:0}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bnav button{border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0 10px;font-size:.75rem;font-weight:600;color:var(--muted);min-height:64px}
.bnav button .ic{padding:3px 16px;border-radius:14px;display:flex}
.bnav button[aria-selected="true"]{color:var(--ink)}
.bnav button[aria-selected="true"] .ic{background:color-mix(in srgb,var(--olive) 24%,transparent)}
.hero{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:18px;border:0;background:var(--olive);color:var(--on-olive);width:100%}
.hero .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .htitle{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;text-transform:uppercase}
.hero .hsub{font-family:var(--mono);font-size:.82rem;opacity:.9}
.hero .hgo{display:flex;align-items:center;gap:4px;font-weight:600;align-self:flex-end}
.drows{display:flex;flex-direction:column;gap:8px}
.drow{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.drow.today{border:2px solid var(--olive);padding:9px 11px}
.drow.off{background:repeating-linear-gradient(135deg,var(--surface) 0 7px,var(--soft) 7px 9px)}
.drow .dl{width:42px;flex:0 0 auto;display:flex;flex-direction:column;line-height:1.05}
.drow .dl b{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em}
.drow .dl span{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.drow .di{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.drow .muted{color:var(--muted);font-size:.9rem}
.drow svg{color:var(--muted);flex:0 0 auto}
.it{display:flex;align-items:center;gap:8px;min-width:0;font-size:.95rem}
.it i{width:4px;height:18px;border-radius:2px;flex:0 0 auto;background:var(--c-gym)}
.it em{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--muted);width:10px}
.it span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.sc i{background:var(--c-sc)} .it.run i{background:var(--c-run)} .it.cf i{background:var(--c-cf)}
.it.cmp i{background:transparent;border:1.5px solid var(--muted)} .it.cmp span{font-weight:500;color:var(--muted)}
.it.imp i{background:transparent;border:1.5px dashed var(--c-run)} .it.imp span{font-weight:500;font-style:italic}
#sheet .sheet-bg{position:fixed;inset:0;z-index:40;border:0;border-radius:0;background:rgba(0,0,0,.55);padding:0}
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;overscroll-behavior:contain}
#sheet .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
#sheet .sheet-x{position:absolute;top:8px;right:10px;border:0;background:transparent;color:var(--ink);width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center}
#sheet h2{font-size:1.6rem;padding-right:44px}
#sheet .panel{border:0;padding:0;background:transparent}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--soft)}
.seg button{border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.lbl{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border-radius:22px;padding:6px 14px;font-weight:600;font-size:.9rem;border:1.5px solid var(--line);background:transparent}
.opt[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.sessbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.sessbtn i{width:4px;height:32px;border-radius:2px;background:var(--c-gym);flex:0 0 auto}
.sessbtn.sc i{background:var(--c-sc)} .sessbtn.run i{background:var(--c-run)} .sessbtn.cf i{background:var(--c-cf)}
.sessbtn span{flex:1;display:flex;flex-direction:column;font-weight:600}
.sessbtn em{font-style:normal;font-weight:500;font-size:.75rem;color:var(--muted)}
.backbtn{align-self:flex-start;display:flex;align-items:center;gap:4px;padding:4px 8px}
button.big{min-height:52px;font-size:1rem;width:100%}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;resize:vertical}
.btnlike{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);font-size:.95rem;text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer}
.legend i{background:var(--c-gym)}
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authcard{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px}
.authcard form{display:flex;flex-direction:column;gap:8px}
.authcard input{min-height:46px}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (max-width:520px){.lifts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.lift{padding:10px}.lift .big{font-size:1.25rem}}
@media (min-width:760px){.top{padding-inline:max(16px,calc((100vw - 760px)/2 + 16px))}}

</style>
</head>
<body>
<div id="auth" class="authwrap" hidden>
  <div class="authcard">
    <img src="icon-192.png" alt="" width="72" height="72" style="border-radius:16px">
    <h1>PDT 360</h1>
    <p class="meta" style="margin-top:-6px">Physical Duty Training 360</p>
    <p class="meta">Entra con tu cuenta para guardar y sincronizar tus datos.</p>
    <form id="authForm">
      <label for="authEmail">Correo</label>
      <input id="authEmail" type="email" autocomplete="email" required>
      <label for="authPass">Contraseña</label>
      <input id="authPass" type="password" autocomplete="current-password" minlength="6" required>
      <div class="toolbar" style="margin-top:6px"><button class="primary" type="submit" value="in">Entrar</button><button type="submit" value="new">Crear cuenta</button></div>
      <button type="button" class="ghost" id="authReset">He olvidado la contraseña</button>
    </form>
    <p id="authMsg" class="meta" role="status"></p>
  </div>
</div>
<div id="app" hidden>
  <header class="top">
    <h1 id="ptitle">Semana</h1>
    <div class="weeknav" id="weeknav">
      <button id="prevW" aria-label="Semana anterior">‹</button>
      <div class="lbl" id="wlbl"></div>
      <button id="nextW" aria-label="Semana siguiente">›</button>
      <button id="todayW" class="ghost">Hoy</button>
    </div>
    <button class="iconbtn ghost" data-act="repnew" aria-label="Reportar fallo o sugerencia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button>
  </header>
  <main id="view" class="wrap"></main>
</div>
<nav class="bnav" aria-label="Secciones" hidden>
  <button data-tab="semana" aria-selected="true"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Semana</button>
  <button data-tab="entrenar" aria-selected="false"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg></span>Entrenar</button>
  <button data-tab="calendario" aria-selected="false"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Calendario</button>
  <button data-tab="progreso" aria-selected="false"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Progreso</button>
</nav>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
